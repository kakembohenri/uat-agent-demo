{% extends "base.html" %}

{% block title %}Login · Issue Tracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="panel auth-panel">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to manage your issues.</p>

        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="issue-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    value="{{ email | default('') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="button button-primary button-full" type="submit">
                Sign in
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>
</div>
{% endblock %}
