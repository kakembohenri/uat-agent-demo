{% extends "base.html" %}

{% block title %}Register · Issue Tracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="panel auth-panel">
        <h1>Create an account</h1>
        <p class="muted">Sign up to start tracking your issues.</p>

        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register" class="issue-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    value="{{ email | default('') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
                <small>Use at least 6 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button class="button button-primary button-full" type="submit">
                Create account
            </button>
        </form>

        <p class="auth-switch">
            Already registered? <a href="/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
